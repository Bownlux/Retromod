summary: Loads on Forge 26.2 across the EventBus 7 break; constructs, registers, and reaches the menu.
details: Forge 26.2 (Forge 65.x) replaced EventBus 6 with EventBus 7, which used to kill every old Forge
  mod at construction. The snapshot.7 LegacyEventBus bridge maps the old idiom (getModEventBus, DeferredRegister.register(bus),
  MinecraftForge.EVENT_BUS, @SubscribeEvent, EventPriority) onto BusGroup, and as of snapshot.7 the lambda
  setup listeners (addListener(this::...)) bind too. Verified in-game to the main menu with content registered;
  in-world testing was done on the NeoForge host (see the other entry), and the in-world fixes are loader-shared.
