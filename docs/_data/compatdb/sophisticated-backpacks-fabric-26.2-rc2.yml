summary: Retested on 1.3.0-rc.2. The reported crash is gone, and the mod is now blocked on its
  rendering instead.
details: The original report (issue 249) crashed on a call to Lifecycle, which rc-1 fixed. Both jars
  now transform without error. What stops them is two model bases Minecraft removed, ItemOverrides
  and AgeableListModel, which BackpackDynamicModel and BackpackModel extend. Neither can be
  rebased. EntityModel survives but its whole contract changed at 26.x, from a type parameter of
  Entity to one of EntityRenderState and from a no-argument constructor to one taking a ModelPart,
  and setupAnim is gone. A stand-in base would link and then draw nothing, so Retromod reports the
  missing base by name instead. This needs a real port of the mod's rendering.
reporter: Bownlux
