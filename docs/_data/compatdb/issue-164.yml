details: "This mod transforms nearly perfectly, with the only issue being a Retromod built-in class, which doesn't affect any functionality [(Verification report)](https://github.com/user-attachments/files/30105161/Luminous_Wool.txt). Minecraft loads with the transformed mod and can load into a world. The blocks are registered and can be crafted; luminating the blocks with glow ink sacs (and the advancement \"Glowpunk\") also works. They also luminate light from themselves, which is the point of this mod. <img width=\"1920\" height=\"1080\" alt=\"Image\" src=\"https://github.com/user-attachments/assets/efbcc15d-179c-4a27-96bc-a2e9a5615471\" />"
