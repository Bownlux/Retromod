summary: The game runs with it installed, but the async-particle optimization (and its config) is inert
  on a non-matching host.
details: AsyncParticles is coremod-class - it wraps the Mixin service itself and generates conditional
  mixins at load time. On 1.21.11 its own machinery cancels most of its mixins, and its core @Overwrite
  targets a ParticleEngine method whose signature changed, so it cannot apply. An @Overwrite body is the
  replacement code itself; no redirect can rewrite it for a changed method. Listed on Mods That Can't
  Be Translated. (#63)
