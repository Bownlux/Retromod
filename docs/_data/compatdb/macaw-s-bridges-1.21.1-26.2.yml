details: 'The snapshot.7 acceptance mod for the Forge-to-NeoForge migration spine. Needed (and drove)
  a chain of fixes: the FMLJavaModLoadingContext bridge, the registry-id thread-local, the 26.2 ColorCollection
  accessors, the 1.21.4+ client item definitions (all items rendered as the missing-texture checkerboard
  before), and the removed is() overloads (placing a bridge crashed the server tick loop before). Verified
  in-game: creative tabs are fully textured, bridges place, and the world persists across rejoin. Gold
  rather than diamond only because not every block variant was individually play-tested.'
