# Shaped like the MDK template, comments included, for the #358 case. It declares neither a
# minecraft nor a neoforge dependency, either of which would name the Minecraft version, so the
# version is only in the jar manifest's Implementation-Version.
modLoader = "javafml" #mandatory
loaderVersion = "[1,)" #mandatory
license = "MIT"
issueTrackerURL = "https://github.com/Bownlux/Retromod/issues"

[[mods]] #mandatory
modId = "retromod_test_lib_neoforge" #mandatory
version = "0.1.0" #mandatory
displayName = "Retromod Test Library (NeoForge)"
authors = "Bownlux"
description = '''
A library for the Retromod test mod. Install it next to the test mod so the cross-jar case can run.
'''
