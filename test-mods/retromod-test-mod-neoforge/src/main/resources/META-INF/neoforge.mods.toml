modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/Bownlux/Retromod/issues"

[[mods]]
modId = "retromod_test_mod_neoforge"
version = "${version}"
displayName = "Retromod Test Mod (NeoForge)"
authors = "Bownlux"
description = '''
Exercises Retromod's transformation pipeline on NeoForge.
Source compiled against an old NeoForge MC version; Retromod translates it
forward at load time. Test results are logged with the [Retromod-Test-NeoForge] prefix.
'''

[[dependencies.retromod_test_mod_neoforge]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "CLIENT"

# modId comes last on purpose: Retromod must relax this range wherever the block names its mod.
[[dependencies.retromod_test_mod_neoforge]]
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "CLIENT"
modId = "minecraft"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

# A mixin on a method 26.1 renamed, for the RenamedMixinTargetCase.
[[mixins]]
config = "retromod_test_mod_neoforge.mixins.json"
