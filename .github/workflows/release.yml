name: Release latest main build

# Publishes a rolling "latest" pre-release on every successful CI run against
# main. The release tag (`latest`) is force-updated each time, so users always
# get the most recent build by downloading from the same URL.
#
# Versioned releases (e.g. v1.0.0-beta.6) are still cut by hand for milestone
# tags - this workflow does NOT touch those. It only manages the rolling
# release.
#
# Why workflow_run instead of `on: push`?
# ---------------------------------------
# Gating on CI completion means we never ship a build whose tests failed.
# The downside is a small UX wart: the Release workflow shows "skipped" in
# the Actions tab on every CI failure, which can look alarming. That's the
# trade - quality > tidy logs.
#
# Why the Fabric and Quilt artifact?
# ----------------------------------
# Maven's shaded JAR is a multi-loader fat JAR that contains Fabric, Quilt,
# Forge, and NeoForge metadata at once. Loaders are partly tolerant of the
# extra loader-family metadata, but distributing this fat JAR is the wrong
# default. Under some loader/MC combinations it gets rejected for
# "looks like a different loader's mod" reasons.
#
# build-all.sh is the ground-truth distribution flow: it extracts the
# shaded JAR, strips other loader families, rewrites the kept metadata for
# a specific MC version, and emits one clean per-loader-family JAR into
# dist/<Loader>/<MC>/. Fabric output intentionally keeps both
# fabric.mod.json and quilt.mod.json. We run that flow and pick the shared output
# because Fabric is Retromod's primary, best-tested loader family (see the
# README's loader matrix). Forge and NeoForge users currently get their
# JARs from milestone releases or by running build-all.sh themselves;
# rolling auto-publish for those is a future improvement.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

# Asset replacement deletes the previous file before uploading the new one. Never overlap or
# cancel this workflow between those operations, or the rolling release can lose its jar.
concurrency:
  group: rolling-github-release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the commit CI ran against
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run runs in the context of the default branch by default,
          # not the triggering commit. Explicitly check out the SHA that CI
          # validated so we package exactly what was tested - not whatever
          # main happens to point at right now.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Need full history for the "commits since last release" body.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tested commit belongs to main
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "ERROR: checkout does not match the commit reported by CI."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$HEAD_SHA" refs/remotes/origin/main; then
            echo "ERROR: the tested commit is not part of the repository's main branch."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          check-latest: true

      - name: Build the shaded base JAR
        # build-all.sh expects target/retromod-<ver>-all.jar to already exist
        # because we pass --skip-build. Doing the Maven step ourselves (with
        # the cached deps) is cheaper than letting the script invoke another
        # mvn run inside it.
        run: mvn package -q -DskipTests -Dexec.skip=true

      - name: Produce per-loader, per-MC JARs via build-all.sh
        # Forge and NeoForge outputs keep one matching descriptor. Fabric output
        # keeps fabric.mod.json plus quilt.mod.json for the shared Fabric/Quilt artifact.
        # The Fabric/26.2 directory is the one this rolling workflow publishes.
        run: bash build-all.sh --skip-build --require-self-hash

      - name: Resolve version metadata and stage Fabric artifact
        id: ver
        run: |
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          MC_VERSION=26.2

          # build-all.sh emits dist/Fabric/<MC>/retromod-<ver>+<MC>.jar.
          # We rename to make the loader explicit in the downloaded filename
          # - the dist directory disambiguates loader, but a flat GitHub
          # release asset can't, so the suffix carries that information.
          DIST_JAR="dist/Fabric/${MC_VERSION}/retromod-${POM_VERSION}+${MC_VERSION}.jar"
          ARTIFACT_NAME="retromod-${POM_VERSION}+${MC_VERSION}-fabric.jar"

          if [ ! -f "$DIST_JAR" ]; then
            echo "ERROR: expected Fabric build at $DIST_JAR but it doesn't exist."
            echo "build-all.sh output:"
            find dist -name '*.jar' | head -20
            exit 1
          fi

          cp "$DIST_JAR" "$ARTIFACT_NAME"

          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Number of commits since this rolling release was last cut. The
          # `latest` tag may not exist on first run - fall back to "?".
          if git rev-parse --verify --quiet refs/tags/latest >/dev/null; then
            COMMITS_SINCE=$(git rev-list --count latest..HEAD)
          else
            COMMITS_SINCE="?"
          fi

          {
            echo "artifact_name=${ARTIFACT_NAME}"
            echo "pom_version=${POM_VERSION}"
            echo "mc_version=${MC_VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "built_at=${BUILT_AT}"
            echo "commits_since=${COMMITS_SINCE}"
          } >> "$GITHUB_OUTPUT"

      - name: Compute SHA-256 for the artifact
        id: hash
        run: |
          SHA256=$(sha256sum "${{ steps.ver.outputs.artifact_name }}" | awk '{print $1}')
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Confirm this is still the current main commit
        id: freshness
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          MAIN_SHA=$(git rev-parse refs/remotes/origin/main)
          if [ "$HEAD_SHA" != "$MAIN_SHA" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale release candidate $HEAD_SHA. Current main is $MAIN_SHA."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish rolling release
        id: rolling_release
        if: steps.freshness.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: latest
          # The action updates release metadata. The verified step below advances the tag.
          target_commitish: ${{ github.event.workflow_run.head_sha }}

          name: "Latest main build · Fabric and Quilt · ${{ steps.ver.outputs.pom_version }} for MC ${{ steps.ver.outputs.mc_version }}"

          # `prerelease: true` keeps this from being shown as the headline
          # "Latest release" on the repo home page - that slot is reserved
          # for hand-cut milestone releases (v1.0.0-beta.6, future v1.0.0,
          # etc.). `make_latest: false` enforces the same.
          prerelease: true
          make_latest: false

          overwrite_files: true
          fail_on_unmatched_files: true
          files: ${{ steps.ver.outputs.artifact_name }}

          body: |
            Rolling pre-release for Fabric and Quilt on MC ${{ steps.ver.outputs.mc_version }}. It is published after every successful CI run against `main` and always points at the newest passing build. Versioned milestones are cut separately.

            ### What This Is
            This is the Fabric and Quilt variant of Retromod for MC ${{ steps.ver.outputs.mc_version }}. It carries `fabric.mod.json` and `quilt.mod.json`. There is no separate Quilt jar. The fat shaded jar with Forge and NeoForge metadata is not published here because other loader families can reject it.

            The rolling channel does not publish Forge or NeoForge variants. Use a tagged milestone release, or run `bash build-all.sh` to produce `dist/Forge/<MC>/` and `dist/NeoForge/<MC>/` artifacts.

            ### Build Info
            | Field | Value |
            |---|---|
            | Loader | Fabric and Quilt |
            | Target Minecraft | ${{ steps.ver.outputs.mc_version }} |
            | Source commit | [`${{ steps.ver.outputs.short_sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}) |
            | Built at | `${{ steps.ver.outputs.built_at }}` |
            | Commits since previous rolling release | `${{ steps.ver.outputs.commits_since }}` |
            | Java | 25 (Temurin) |

            ### Install
            1. Download `${{ steps.ver.outputs.artifact_name }}` below.
            2. Drop it into your Fabric or Quilt instance's `mods/` folder.
            3. Launch once. Retromod creates `retromod-input/` next to `mods/`. Drop old mods there for transformation, then restart when prompted.

            See the [installation docs](https://bownlux.github.io/Retromod/installation) for the full per-loader walkthrough.

            ### Verify the Download
            ```
            SHA-256: ${{ steps.hash.outputs.sha256 }}
            ```

            ### Heads Up
            This beta rolling build has had less manual exercise than milestone releases. If something breaks, please attach `latest.log` and the failing mod jar to a [GitHub issue](https://github.com/${{ github.repository }}/issues).

      - name: Verify rolling release asset and advance tag
        if: steps.freshness.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.rolling_release.outputs.id }}
          RELEASE_ASSETS: ${{ steps.rolling_release.outputs.assets }}
          EXPECTED_ASSET: ${{ steps.ver.outputs.artifact_name }}
          EXPECTED_SHA256: ${{ steps.hash.outputs.sha256 }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ASSET_ROW=$(jq -er --arg name "$EXPECTED_ASSET" '
            [.[] | select(.name == $name or .label == $name)]
            | if length == 1 then .[0] else error("expected one uploaded asset") end
            | [.state, (.size | tostring), (.digest // ""), .browser_download_url]
            | @tsv
          ' <<< "$RELEASE_ASSETS")
          IFS=$'\t' read -r ASSET_STATE ASSET_SIZE ASSET_DIGEST ASSET_URL <<< "$ASSET_ROW"

          EXPECTED_SIZE=$(stat -c '%s' "$EXPECTED_ASSET")
          if [ "$ASSET_STATE" != "uploaded" ] || [ "$ASSET_SIZE" != "$EXPECTED_SIZE" ]; then
            echo "ERROR: GitHub did not retain the expected uploaded asset."
            exit 1
          fi
          if [ "$ASSET_DIGEST" != "sha256:$EXPECTED_SHA256" ]; then
            echo "ERROR: GitHub's asset digest does not match the staged jar."
            exit 1
          fi

          VERIFIED_ASSET="$RUNNER_TEMP/$EXPECTED_ASSET"
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/octet-stream" \
            "$ASSET_URL" --output "$VERIFIED_ASSET"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$VERIFIED_ASSET" | sha256sum --check

          RELEASE_TARGET=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.target_commitish')
          if [ "$RELEASE_TARGET" != "$HEAD_SHA" ]; then
            echo "ERROR: rolling release metadata points to $RELEASE_TARGET instead of $HEAD_SHA."
            exit 1
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
            -f sha="$HEAD_SHA" -F force=true >/dev/null
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" --jq '.object.sha')
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "ERROR: latest points to $TAG_SHA instead of $HEAD_SHA."
            exit 1
          fi
